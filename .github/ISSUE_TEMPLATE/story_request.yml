name: Story request
description: Propose a scoped story for feature, improvement, or admin planning work
labels: [type/story, status/todo, priority/medium]
title: "[Story] "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the work as a story so it can be triaged and planned consistently.
        Link relevant goals from GOALS.md and keep scope explicit.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the story outcome
      placeholder: Provide a concise summary of the story.
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Use the format - As a [user], I can [action], so that [benefit]
      placeholder: As a ..., I can ..., so that ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what this issue will and will not cover
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List clear, testable outcomes
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: Note risks, assumptions, or trade-offs
      placeholder: |
        - Risk:
        - Mitigation:
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goal links
      description: Link relevant goals from GOALS.md (for example G1, G2)
      placeholder: |
        - G2 (...)
        - G5 (...)
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related context
      description: Related issue/PR links, repo context, or constraints
